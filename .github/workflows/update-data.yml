name: Update GPIX data

on:
  schedule:
    # 13:35 UTC = 9:35am ET (EDT) / 8:35am ET (EST), weekdays.
    # Uses the prior close either way; runs before the user checks it in the morning.
    - cron: "35 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data.json
        run: python3 scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "no changes" || git commit -m "data: daily refresh $(date -u +%F)"
          git push
