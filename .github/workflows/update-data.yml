name: Update GPIX/GPIQ/TSLA/SPCX/NVDA/GOOG data

on:
  schedule:
    # 13:35 UTC = 9:35am ET (EDT) / 8:35am ET (EST), weekdays.
    # Uses the prior close either way; runs before the user checks it in the morning.
    - cron: "35 13 * * 1-5"
    # 19:15 UTC = 3:15pm ET (EDT) / 2:15pm ET (EST), weekdays: a fresh buy
    # score right before the buy-at-close window. The engine updates today's
    # history row in place, so the two runs never duplicate a date.
    - cron: "15 19 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build data, history and feed files
        run: python3 scripts/build_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data-gpiq.json docs/data-tsla.json docs/data-spcx.json \
                  docs/data-nvda.json docs/data-goog.json \
                  docs/history.json docs/history-gpiq.json docs/history-tsla.json docs/history-spcx.json \
                  docs/history-nvda.json docs/history-goog.json \
                  docs/feed.xml
          git diff --cached --quiet && echo "no changes" || git commit -m "data: daily refresh $(date -u +%F)"
          # Retry push: GitHub occasionally returns 500 Internal Server Error.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "git push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
