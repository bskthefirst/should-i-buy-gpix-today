name: Update GPIX/GPIQ/TSLA/SPCX/NVDA/GOOG data

on:
  schedule:
    # GitHub starts scheduled runs HOURS late (2 to 9.5 hours since 2026-08-26;
    # before that, under an hour) and promises no upper limit. So these entries
    # fire early on purpose. scripts/gate.py then waits for a New York window:
    #   pre-open 07:00-09:15, pre-close 15:10-15:45, post-close 16:25-19:00
    # (New York time, so it is right in both EDT and EST). Each entry has a primary
    # window in scripts/gate.py; a late run falls forward to the next window.
    # A window that already has a refresh is skipped. Minutes avoid the busy
    # :00/:15/:30/:45 marks. UTC times, EDT / EST:
    - cron: "7 1 * * 1-5"     # 21:07 / 20:07 (evening before) -> pre-open, only if GitHub is 4-12 h late
    - cron: "37 6 * * 1-5"    # 02:37 / 01:37  -> pre-open
    - cron: "7 9 * * 1-5"     # 05:07 / 04:07  -> pre-open (backup)
    - cron: "7 12 * * 1-5"    # 08:07 / 07:07  -> pre-open (backup)
    - cron: "52 14 * * 1-5"   # 10:52 / 09:52  -> pre-close
    - cron: "52 17 * * 1-5"   # 13:52 / 12:52  -> post-close
  workflow_dispatch:          # a manual or external call skips the gate and builds at once

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new Ubuntu on 2026-10-19
    timeout-minutes: 345       # the gate may wait up to 5.5 hours
    outputs:
      run: ${{ steps.gate.outputs.run }}
      window: ${{ steps.gate.outputs.window }}
    steps:
      - uses: actions/checkout@v5
      - id: gate
        name: Wait for the intended New York window
        env:
          CRON: ${{ github.event.schedule }}
        run: python3 scripts/gate.py

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to a new Ubuntu on 2026-10-19
    timeout-minutes: 15
    concurrency:               # one build at a time; a queued duplicate is replaced
      group: update-data
      cancel-in-progress: false
    env:
      WINDOW: ${{ needs.gate.outputs.window }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # the tip of main now, not the commit from when the run was queued
          fetch-depth: 40
      - name: Build, commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Skip a scheduled run when its window already has a refresh.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && git log --since="14 hours ago" --grep="\[$WINDOW\]" --format=%h | grep -q .; then
            echo "The $WINDOW window already has a refresh; skipping this duplicate run."
            exit 0
          fi

          # If main moved while we were building (the owner pushed, or another run
          # finished), do not retry the same push: rebuild on the latest main.
          for attempt in 1 2 3; do
            python3 scripts/build_data.py
            git add docs/data*.json docs/history*.json docs/feed.xml
            if git diff --cached --quiet; then
              echo "no changes"
              break
            fi
            git commit -q -m "data: daily refresh $(TZ=America/New_York date +%F) [$WINDOW]"
            if git push -q origin HEAD:main; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::push was rejected 3 times"
              exit 1
            fi
            echo "::warning::push rejected (attempt $attempt); rebuilding on the latest main"
            sleep $((attempt * 10))
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
          done
      - name: Check data health
        run: python3 scripts/check_health.py
